name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: leafie-test-only
          POSTGRES_DB: leafie_letter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LETTER_TEST_DATABASE_URL: postgresql+asyncpg://postgres:leafie-test-only@127.0.0.1:5432/leafie_letter_test
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Dependency check
        run: pip check
      - name: Migration graph check
        run: test "$(alembic heads | wc -l | tr -d ' ')" = "1"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
