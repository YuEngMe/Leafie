[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leafie-backend"
version = "0.1.0"
description = "FastAPI backend for Leafie"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "openai>=1.97,<2",
    "pydantic-settings>=2.10,<3",
    "pyjwt[crypto]>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0.41,<3",
    "supabase>=2.17,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
