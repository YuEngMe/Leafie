[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yeso-plant-backend"
version = "0.1.0"
description = "FastAPI backend for the Yeso plant care app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg",
    "fastapi",
    "httpx",
    "openai",
    "pydantic-settings",
    "pyjwt[crypto]",
    "sqlalchemy[asyncio]",
    "supabase",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
