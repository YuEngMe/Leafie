# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "ko-KR"
early_access: false

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true

  path_instructions:
    - path: "backend/**/*.py"
      instructions: |
        FastAPI 비동기 처리, Pydantic 입력 검증, 인증과 리소스 소유권 검사를 확인한다.
        외부 API 호출의 timeout, 예외 처리, 재시도 정책을 확인한다.
        민감 정보가 응답이나 로그에 노출되지 않는지 확인한다.

    - path: "backend/app/tasks/**"
      instructions: |
        Queue 작업의 멱등성, visibility timeout, 최대 재시도와 실패 처리를 확인한다.
        같은 메시지가 여러 번 전달되어도 데이터가 중복 생성되지 않아야 한다.

    - path: "supabase/migrations/**"
      instructions: |
        외래 키, unique 제약, 인덱스, RLS 정책과 migration 롤백 위험을 확인한다.

    - path: "backend/tests/**"
      instructions: |
        정상 경로뿐 아니라 인증 실패, 소유권 위반, 외부 API 실패와 중복 요청을 검증한다.

chat:
  auto_reply: true